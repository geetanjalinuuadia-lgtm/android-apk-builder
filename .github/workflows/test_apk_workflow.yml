name: APK Emulator Test (Private)

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Direct URL to YouTube 21.04.223 APK (required)'
        required: true
        type: string
  pull_request:
    paths:
      - 'upload_v5.mpp'

permissions:
  contents: read

jobs:
  test_apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download YouTube 21.04.223 APK
        run: |
          echo "Downloading YouTube APK..."
          URL="${{ inputs.apk_url }}"
          if [ -z "$URL" ]; then
            echo "ERROR: No APK URL provided. Click Run workflow and paste a direct APK URL in apk_url field"
            exit 1
          fi
          wget -q "$URL" -O youtube-21.04.223.apk || curl -sL -o youtube-21.04.223.apk "$URL"
          ls -la youtube-21.04.223.apk
          if [ ! -s youtube-21.04.223.apk ]; then
            echo "ERROR: APK download failed or file is empty"
            exit 1
          fi

      - name: Install Android SDK tools
        run: |
          mkdir -p ~/android-sdk/cmdline-tools
          cd ~/android-sdk/cmdline-tools
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -O cmdtools.zip
          unzip -q cmdtools.zip
          mv cmdline-tools latest
          export PATH=$PATH:~/android-sdk/cmdline-tools/latest/bin
          yes | sdkmanager --licenses 2>/dev/null
          sdkmanager "platform-tools" "platforms;android-34"

      - name: Install Morphe CLI
        run: |
          wget -q "https://github.com/MorpheusToolkit/Morphe/releases/latest/download/morphe-desktop-all.jar" -O morphe.jar || true
          if [ ! -f "morphe.jar" ]; then
            echo "WARNING: Morphe CLI not found at expected URL"
            echo "Please update this step with the correct Morphe CLI download URL"
          fi

      - name: Patch YouTube APK with MN3X patches
        run: |
          export PATH=$PATH:~/android-sdk/cmdline-tools/latest/bin:~/android-sdk/platform-tools
          echo "=== Patching with Morphe CLI ==="
          java -Xmx4g -jar morphe.jar patch \
            -o patched_youtube.apk \
            --bytecode-mode FULL \
            -p upload_v5.mpp \
            -e "MN3X Master Patch" \
            -e "MN3X Litho Server Override Blocker" \
            -e "MN3X Universal Ad Execution Stripper" \
            -e "MN3X Premium Feature Unlocker" \
            -e "MN3X Background Play Lock" \
            -e "MN3X Layout Element Hider" \
            -e "MN3X Video Downloader" \
            -e "MN3X Custom Guest Mode" \
            -e "MN3X Incognito Mode" \
            -e "MN3X Monet Theme" \
            -e "MN3X Share Sheet" \
            -e "MN3X Account Sheet" \
            -e "MN3X Custom Settings" \
            -e "MN3X Package Renamer" \
            youtube-21.04.223.apk 2>&1 | tee patch_log.txt

      - name: Verify patched APK
        run: |
          export PATH=$PATH:~/android-sdk/cmdline-tools/latest/bin
          echo "=== Verifying Package Name ==="
          aapt dump badging patched_youtube.apk | grep "package: name" || true
          echo "=== Checking DEX and libs ==="
          unzip -l patched_youtube.apk | grep -c '\.dex' || true
          unzip -l patched_youtube.apk | grep -c 'armeabi-v7a' || true

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            patched_youtube.apk
            patch_log.txt
          retention-days: 7
